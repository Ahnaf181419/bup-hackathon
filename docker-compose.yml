services:
  mongodb:
    image: mongo:7.0
    container_name: gridwise_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - gridwise_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gridwise_backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/bup_hackathon
      - CORS_ORIGIN=http://localhost:3000
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-flash-lite}
      - GEMINI_FALLBACK_MODEL=${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - mongodb
    networks:
      - gridwise_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gridwise_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - NEXT_PUBLIC_AUTH_URL=http://localhost:3001
    depends_on:
      - backend
    networks:
      - gridwise_net

volumes:
  mongo_data:

networks:
  gridwise_net:
    driver: bridge
